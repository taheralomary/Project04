<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Photo Switcher | Taher Al-Omari</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <p class="label">Profile Photo Switcher</p>
            <p class="subtitle">Switch between a professional and casual profile photo without reloading.</p>

            <div class="photo-wrap">
                <img id="profilePhoto" src="assets/professional.svg" alt="Professional profile photo placeholder">
            </div>

            <div class="actions">
                <button id="professionalButton" type="button">Professional</button>
                <button id="casualButton" type="button">Casual</button>
            </div>
            <p id="status" class="status" aria-live="polite">Professional photo selected.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
